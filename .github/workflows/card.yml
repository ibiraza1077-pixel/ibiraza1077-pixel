name: Update profile card

on:
  schedule:
    - cron: "17 4 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["card/build.mjs", ".github/workflows/card.yml"]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the card with live GitHub stats
        run: node card/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card
          git diff --cached --quiet || (git commit -m "Update profile card" && git push)
